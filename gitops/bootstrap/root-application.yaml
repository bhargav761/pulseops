apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: pulseops-root
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/bhargav761/pulseops.git
    targetRevision: main
    path: gitops/applications

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true