name: PulseOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------
      # Python Setup
      # ------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: microservices/auth-service/requirements.txt

      - name: Install Backend Dependencies
        working-directory: microservices/auth-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter
        working-directory: microservices/auth-service
        run: ruff check .

      - name: Run Bandit Security Scan
        working-directory: microservices/auth-service
        run: bandit -r .

      - name: Verify Backend Syntax
        working-directory: microservices/auth-service
        run: python -m py_compile main.py

      - name: Run Backend Tests
        working-directory: microservices/auth-service
        env:
          PYTHONPATH: .
        run: pytest

      # ------------------------
      # Node.js Setup
      # ------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        working-directory: frontend/dashboard-ui
        run: npm install

      - name: Build Frontend
        working-directory: frontend/dashboard-ui
        run: npm run build

      # ------------------------
      # Docker Build
      # ------------------------
      - name: Build Backend Docker Image
        run: |
          docker build -t pulseops-backend:latest ./microservices/auth-service

      - name: Build Frontend Docker Image
        run: |
          docker build -t pulseops-frontend:latest ./frontend/dashboard-ui

      # ------------------------
      # Trivy Security Scan
      # ------------------------
      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .

      # ------------------------
      # Helm Validation
      # ------------------------
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Helm Lint
        working-directory: helm/pulseops
        run: helm lint .

      - name: Helm Template Validation
        working-directory: helm/pulseops
        run: helm template pulseops .

      # ------------------------
      # Success
      # ------------------------
      - name: CI Completed Successfully
        run: echo "🎉 PulseOps CI completed successfully!"