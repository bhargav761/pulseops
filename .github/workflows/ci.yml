name: PulseOps CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------------
      # Backend
      # -------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        working-directory: microservices/auth-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Backend Syntax
        working-directory: microservices/auth-service
        run: |
          python -m py_compile main.py

      # -------------------------------
      # Frontend
      # -------------------------------

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        working-directory: frontend/dashboard-ui
        run: |
          npm install

      - name: Build Frontend
        working-directory: frontend/dashboard-ui
        run: |
          npm run build

      # -------------------------------
      # Docker Images
      # -------------------------------

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t pulseops-backend:latest \
            ./microservices/auth-service

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t pulseops-frontend:latest \
            ./frontend/dashboard-ui

      # -------------------------------
      # Success
      # -------------------------------
        
      - name: CI Completed
        run: echo "🎉 PulseOps CI completed successfully!"

              # -------------------------------
      # Install Helm
      # -------------------------------
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      # -------------------------------
      # Helm Validation
      # -------------------------------
      - name: Helm Lint
        working-directory: helm/pulseops
        run: helm lint .

      - name: Helm Template Validation
        working-directory: helm/pulseops
        run: helm template pulseops .