name: PulseOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  ###########################################################
  # Backend + Frontend + Helm Validation
  ###########################################################

  build:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7

      #######################################################
      # Python
      #######################################################

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: microservices/auth-service/requirements.txt

      - name: Install Backend Dependencies
        working-directory: microservices/auth-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pytest

      - name: Run Ruff
        working-directory: microservices/auth-service
        run: ruff check .

      - name: Run Bandit
        working-directory: microservices/auth-service
        run: bandit -r . -s B101

      - name: Verify Backend Syntax
        working-directory: microservices/auth-service
        run: python -m py_compile main.py

      - name: Run Backend Tests
        working-directory: microservices/auth-service
        env:
          PYTHONPATH: .
        run: pytest -v

      #######################################################
      # Frontend
      #######################################################

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Frontend Dependencies
        working-directory: frontend/dashboard-ui
        run: npm install

      - name: Build Frontend
        working-directory: frontend/dashboard-ui
        run: npm run build

      #######################################################
      # Docker
      #######################################################

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t pulseops-backend:latest \
            ./microservices/auth-service

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t pulseops-frontend:latest \
            ./frontend/dashboard-ui

      #######################################################
      # Security Scan
      #######################################################

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .

      #######################################################
      # Helm Validation
      #######################################################

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Helm Lint
        working-directory: helm/pulseops
        run: helm lint .

      - name: Helm Template Validation
        working-directory: helm/pulseops
        run: helm template pulseops .

      - name: Build Validation Completed
        run: echo "✅ Backend + Frontend + Helm validation completed."

  ###########################################################
  # AI Incident Analyzer Validation
  ###########################################################

  aiops:
    name: AI Incident Analyzer
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aiops/incident-analyzer

    env:
      GEMINI_API_KEY: dummy-key
      PROMETHEUS_URL: http://localhost:9090
      LOKI_URL: http://localhost:3100

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7

      #######################################################
      # Python
      #######################################################

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: aiops/incident-analyzer/requirements.txt

      - name: Install AI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pytest

      #######################################################
      # Code Quality
      #######################################################

      - name: Verify Python Syntax
        run: python -m py_compile main.py

      - name: Run Ruff
        run: ruff check .

      - name: Run Bandit
        run: bandit -r . -s B101

      #######################################################
      # Testing
      #######################################################

      - name: Run Unit Tests
        run: pytest -v

      #######################################################
      # Docker
      #######################################################

      - name: Build AI Docker Image
        run: docker build -t pulseops-ai:latest .

      #######################################################
      # Completed
      #######################################################

      - name: AI Incident Analyzer Validation Completed
        run: echo "✅ AI Incident Analyzer validation completed successfully."