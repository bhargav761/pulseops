name: PulseOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ==========================================================
  # Backend + Frontend + Helm
  # ==========================================================

  build:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------
      # Python
      # --------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: microservices/auth-service/requirements.txt

      - name: Install Backend Dependencies
        working-directory: microservices/auth-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        working-directory: microservices/auth-service
        run: |
          ruff check .

      - name: Bandit
        working-directory: microservices/auth-service
        run: |
          bandit -r . -s B101

      - name: Verify Backend Syntax
        working-directory: microservices/auth-service
        run: |
          python -m py_compile main.py

      - name: Run Backend Tests
        working-directory: microservices/auth-service
        env:
          PYTHONPATH: .
        run: |
          pytest -v

      # --------------------------
      # Node
      # --------------------------

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Frontend Dependencies
        working-directory: frontend/dashboard-ui
        run: npm install

      - name: Build Frontend
        working-directory: frontend/dashboard-ui
        run: npm run build

      # --------------------------
      # Docker
      # --------------------------

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t pulseops-backend:latest \
            ./microservices/auth-service

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t pulseops-frontend:latest \
            ./frontend/dashboard-ui

      # --------------------------
      # Security
      # --------------------------

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .

      # --------------------------
      # Helm
      # --------------------------

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Helm Lint
        working-directory: helm/pulseops
        run: |
          helm lint .

      - name: Helm Template Validation
        working-directory: helm/pulseops
        run: |
          helm template pulseops .

      - name: Build Completed
        run: echo "Backend + Frontend Validation Completed"

  # ==========================================================
  # AI Incident Analyzer
  # ==========================================================

  aiops:
    name: AI Incident Analyzer
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aiops/incident-analyzer

    env:
      GEMINI_API_KEY: dummy-key
      PROMETHEUS_URL: http://localhost:9090
      LOKI_URL: http://localhost:3100

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: aiops/incident-analyzer/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Syntax
        run: |
          python -m py_compile main.py

      - name: Ruff
        run: |
          ruff check .

      - name: Bandit
        run: |
          bandit -r . -s B101

      - name: Run Unit Tests
        run: |
          pytest -v

      - name: Build Docker Image
        run: |
          docker build -t pulseops-ai:latest .

      - name: AI Incident Analyzer Validation Completed
        run: echo "AI Incident Analyzer Passed"