apiVersion: apps/v1
kind: Deployment

metadata:
  name: pulseops-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: pulseops-backend

  template:
    metadata:
      labels:
        app: pulseops-backend

    spec:
      containers:
        - name: backend

          image: pulseops-backend:v2
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: pulseops-backend-config

            - secretRef:
                name: pulseops-backend-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"