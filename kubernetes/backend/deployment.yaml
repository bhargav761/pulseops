apiVersion: apps/v1
kind: Deployment

metadata:
  name: pulseops-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: pulseops-backend

  template:
    metadata:
      labels:
        app: pulseops-backend

    spec:
      containers:
        - name: backend
          image: pulseops-backend:v2
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5

          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 10

          envFrom:
            - configMapRef:
                name: pulseops-backend-config
            - secretRef:
                name: pulseops-backend-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"