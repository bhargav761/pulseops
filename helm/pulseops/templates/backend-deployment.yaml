apiVersion: apps/v1
kind: Deployment

metadata:
  name: pulseops-backend

spec:
  replicas: {{ .Values.backend.replicaCount }}

  selector:
    matchLabels:
      app: pulseops-backend

  template:
    metadata:
      labels:
        app: pulseops-backend

    spec:
      containers:

      - name: backend

        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"

        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}

        ports:
        - containerPort: 8000

        envFrom:
        - configMapRef:
            name: pulseops-backend-config

        - secretRef:
            name: pulseops-backend-secret

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"