# ====================================================
# PulseOps Helm Values
# ====================================================

backend:
  replicaCount: 2

  image:
    repository: pulseops-backend
    tag: v2
    pullPolicy: IfNotPresent

  service:
    type: NodePort
    port: 8000

frontend:
  replicaCount: 2

  image:
    repository: pulseops-frontend
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: NodePort
    port: 5173

prometheus:
  enabled: true

grafana:
  enabled: true

loki:
  enabled: true

promtail:
  enabled: true

ingress:
  enabled: true

hpa:
  enabled: true
config:
  prometheusUrl: "http://prometheus:9090/api/v1/query"
secret:
  apiKey: "pulseops-secret-key"  


aiops:

  replicaCount: 2

  image:
    repository: pulseops-ai
    tag: latest
    pullPolicy: IfNotPresent

  config:
    prometheusUrl: http://prometheus.monitoring.svc.cluster.local:9090
    lokiUrl: http://loki.monitoring.svc.cluster.local:3100
    databasePath: /app/pulseops.db
    logLevel: INFO
    aiModel: gemini-2.5-flash

  secret:
    geminiApiKey: replace-with-your-api-key
    geminiModel: gemini-2.5-flash
    appEnv: production

  resources:
    requests:
      cpu: 100m
      memory: 256Mi

    limits:
      cpu: 500m
      memory: 512Mi

  hpa:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70